[phases.setup]
# python312Packages.venv NO EXISTE en Nixpkgs Railway bc8f8d1.
# venv (ensurepip) VIENE INCLUIDO DENTRO DE python312 DESDE Python 3.3+ 2012. NO necesita paquete nix.
nixPkgs = ["python312", "python312Packages.pip"]

[phases.install]
# PEP 668 FIX Railway Nixpacks 2025 Ubuntu 24.04: venv + PATH + PyPI directo U2Net/ONNX.
cmds = [
  "python3 -m venv /opt/venv",
  "export PATH=/opt/venv/bin:$PATH",
  "which python && python --version",
  "python -m pip install --upgrade pip setuptools wheel",
  "pip install --no-cache-dir --index-url https://pypi.org/simple/ --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt"
]

[phases.build]
cmds = []

[start]
cmd = "export PATH=/opt/venv/bin:$PATH && which uvicorn && uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 1 --timeout-keep-alive 900 --timeout-graceful-shutdown 300"
